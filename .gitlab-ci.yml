variables:
  NODE_VERSION: "22.23.4"
  NODE_LINUX_X64_SHA256: "1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce"

stages:
  - test
  - review

# Shared rules: run on merge requests and on the default branch.
.default_rules: &default_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Shared setup: install a pinned Node, enable pnpm via corepack, install deps.
.node_before_script: &node_before_script
  - curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o "/tmp/node-v${NODE_VERSION}-linux-x64.tar.xz"
  - echo "${NODE_LINUX_X64_SHA256}  /tmp/node-v${NODE_VERSION}-linux-x64.tar.xz" | sha256sum -c -
  - tar -xJf "/tmp/node-v${NODE_VERSION}-linux-x64.tar.xz" -C /tmp
  - export PATH="/tmp/node-v${NODE_VERSION}-linux-x64/bin:$PATH"
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.cfdata.org/".insteadOf "git@gitlab.cfdata.org:"
  - corepack enable
  - git submodule update --init
  - pnpm install --frozen-lockfile

# ---------------------------------------------------------------------------
# Lint (blocking)
# ---------------------------------------------------------------------------
# Runs `oxlint` and recursive `tsc --noEmit` (`types:check`).
lint:
  stage: test
  tags:
    - vm-linux-x86-4cpu-8gb
  rules: *default_rules
  before_script: *node_before_script
  script:
    - pnpm lint

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------
test:
  stage: test
  tags:
    - vm-linux-x86-4cpu-8gb
  rules: *default_rules
  before_script: *node_before_script
  script:
    - pnpm build
    - pnpm test

include:
  # ---------------------------------------------------------------------------
  # AI code review (MR only)
  # ---------------------------------------------------------------------------
  - component: $CI_SERVER_FQDN/cloudflare/ci/ai/opencode@~latest
    inputs:
      stage: review
      runOnMR: true
      ASSIGN_REVIEWERS: false
